# Production stack, deployed by Dokploy (Docker Compose from this repository).
# Images are built and pushed to GHCR by CI. Only web and ingest are routed by Traefik;
# api, PostgreSQL, Kafka and Redis are reachable on the internal network only (D-048).
#
# Required environment (Dokploy → Environment):
#   IMAGE_PREFIX            e.g. ghcr.io/<owner>/whole-story
#   IMAGE_TAG               e.g. latest or a commit sha
#   POSTGRES_PASSWORD, API_DB_PASSWORD, PROCESSOR_DB_PASSWORD
#   MAXMIND_ACCOUNT_ID, MAXMIND_LICENSE_KEY    GeoLite2 download credentials
#   MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM, MAIL_PORT (optional, defaults to 465)
#   GRAFANA_ADMIN_PASSWORD  the login for https://metrics.wholestory.world (GRAFANA_ADMIN_USER optional)

name: wholestory

x-java-service: &java-service
  restart: unless-stopped
  networks: [internal]
  environment: &java-env
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wholestory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?required}
      PROCESSOR_DB_PASSWORD: ${PROCESSOR_DB_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wholestory"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Keeps the GeoLite2 City database current: MaxMind publishes twice a week and the licence requires
  # running a recent copy. ingest mounts the same volume read-only and reloads the file when it changes.
  geoipupdate:
    image: maxmindinc/geoipupdate:v8.0.0
    restart: unless-stopped
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:?required}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:?required}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      GEOIPUPDATE_FREQUENCY: 72 # hours; also downloads once on start
    volumes:
      - geoip:/usr/share/GeoIP
    networks: [internal]

  ingest:
    <<: *java-service
    image: ${IMAGE_PREFIX:?required}-ingest:${IMAGE_TAG:-latest}
    pull_policy: always # a moving tag like 'latest' must be re-pulled on every deploy
    environment:
      <<: *java-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      GEOIP_DATABASE: /geoip/GeoLite2-City.mmdb
    # Read-only, and deliberately not a depends_on: ingest starts and accepts events before the first download.
    volumes:
      - geoip:/geoip:ro
    networks: [internal, public]
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # Health now answers on the management port, not the service port: actuator was moved off 8081 so that a
      # public route can never reach /actuator/prometheus (ADR 0024). Pointing this at 8081 would make the
      # container permanently unhealthy and stop the whole stack from coming up.
      test: ["CMD", "curl", "-fsS", "http://localhost:9081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 30

  processor:
    <<: *java-service
    image: ${IMAGE_PREFIX:?required}-processor:${IMAGE_TAG:-latest}
    pull_policy: always # a moving tag like 'latest' must be re-pulled on every deploy
    environment:
      <<: *java-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/wholestory
      DATABASE_USERNAME: wholestory_processor
      DATABASE_PASSWORD: ${PROCESSOR_DB_PASSWORD:?required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 30

  api:
    <<: *java-service
    image: ${IMAGE_PREFIX:?required}-api:${IMAGE_TAG:-latest}
    pull_policy: always # a moving tag like 'latest' must be re-pulled on every deploy
    environment:
      <<: *java-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/wholestory
      DATABASE_USERNAME: wholestory_api
      DATABASE_PASSWORD: ${API_DB_PASSWORD:?required}
      # Sessions live in Redis (ADR 0018).
      REDIS_HOST: redis
      # api publishes site-events through the outbox (ADR 0009, ADR 0019).
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Password reset mail over the domain's own SMTP host (ADR 0021). Required rather than optional: a missing
      # setting here would break the chain silently, and the symptom would be a reset mail that never arrives.
      MAIL_HOST: ${MAIL_HOST:?required}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:?required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?required}
      MAIL_FROM: ${MAIL_FROM:?required}
      # Where a reset link points.
      WEB_BASE_URL: https://app.wholestory.world
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      # api reads processor's analytics views, which processor's migrations create.
      processor: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 30

  web:
    image: ${IMAGE_PREFIX:?required}-web:${IMAGE_TAG:-latest}
    pull_policy: always # a moving tag like 'latest' must be re-pulled on every deploy
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
      # The snippet customers paste points at the public host, not the dashboard's.
      TRACKER_URL: https://wholestory.world/js/ws.js
      # Which host serves what (proxy.ts). Marketing and the shared dashboards on the apex, the account on
      # app.; without both names set, routing by host is off, which is what local development needs.
      MARKETING_HOST: wholestory.world
      APP_HOST: app.wholestory.world
    networks: [internal, public]
    depends_on:
      api: { condition: service_healthy }

  # Observability. The host has 32 GB with 8 in use, which is what settled the question of whether these two
  # belong next to four JVMs, Postgres and Kafka (ADR 0024).
  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      # Nothing writes to Prometheus from outside and nobody opens its own UI: it is scraped from within this
      # network and read through Grafana. Turning the admin API off removes the delete/snapshot endpoints.
      - --web.enable-admin-api=false
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Internal only, and deliberately not routed: Prometheus has no authentication whatsoever.
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana-oss:12.3.1
    restart: unless-stopped
    environment:
      # The one published piece of the monitoring stack, so it carries the login. Anonymous access and sign-up
      # are both off explicitly rather than left at their defaults: these dashboards show customer traffic.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Behind Traefik, so Grafana has to be told its own address or its redirects point at the container.
      GF_SERVER_ROOT_URL: https://metrics.wholestory.world
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Grafana's own database: who is logged in, saved preferences. The dashboards come from the files above
      # on every start, so losing this volume costs nothing but a session.
      - grafana-data:/var/lib/grafana
    networks: [internal, public]
    depends_on:
      prometheus: { condition: service_healthy }

networks:
  internal:
  # Traefik's network, managed by Dokploy.
  public:
    external: true
    name: ${TRAEFIK_NETWORK:-dokploy-network}

volumes:
  postgres-data:
  kafka-data:
  redis-data:
  geoip:
  prometheus-data:
  grafana-data:
