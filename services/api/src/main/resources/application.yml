spring:
  application:
    name: api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wholestory}
    username: ${DATABASE_USERNAME:wholestory_api}
    password: ${DATABASE_PASSWORD:api}
  flyway:
    # api owns identity, sites and platform (D-012); analytics is read through processor's api_* views.
    schemas: identity,sites,platform
    default-schema: identity
    create-schemas: false
  modulith:
    events:
      jdbc:
        schema: platform
        schema-initialization:
          # Off explicitly: naming a schema otherwise makes Modulith run CREATE SCHEMA at startup, which the api
          # role has no privilege for and does not need — Flyway owns every table in this database.
          enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
  jpa:
    # Flyway owns the schema; Hibernate only checks that the mapping still matches it.
    hibernate:
      ddl-auto: validate
    # A lazy association must never be resolved while rendering a response: aggregates are loaded whole.
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    # Long enough that a dashboard is not a login screen, short enough to expire an abandoned browser (ADR 0018).
    timeout: 14d
    redis:
      namespace: wholestory:session

server:
  port: 8080

wholestory:
  session:
    # The rest of the cookie's attributes are set in SecurityConfig, where they cannot be lost.
    # Browsers treat localhost as a secure context, so this also holds for local development over HTTP.
    secure-cookie: ${SESSION_SECURE_COOKIE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
