spring:
  application:
    name: api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wholestory}
    username: ${DATABASE_USERNAME:wholestory_api}
    password: ${DATABASE_PASSWORD:api}
  flyway:
    # api owns identity, sites and platform (D-012); analytics is read through processor's api_* views.
    schemas: identity,sites,platform
    default-schema: identity
    create-schemas: false
  modulith:
    events:
      # The whole point of an outbox: a publication that never reached the broker is sent again rather than
      # sitting in the table forever. Off by default, which made ADR 0009's promise untrue until it was set.
      republish-outstanding-events-on-restart: true
      jdbc:
        schema: platform
        schema-initialization:
          # Off explicitly: naming a schema otherwise makes Modulith run CREATE SCHEMA at startup, which the api
          # role has no privilege for and does not need — Flyway owns every table in this database.
          enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
  jpa:
    # Flyway owns the schema; Hibernate only checks that the mapping still matches it.
    hibernate:
      ddl-auto: validate
    # A lazy association must never be resolved while rendering a response: aggregates are loaded whole.
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    # Long enough that a dashboard is not a login screen, short enough to expire an abandoned browser (ADR 0018).
    timeout: 14d
    # Boot 4 removed spring.session.redis.* in favour of this prefix. The old spelling is not an alias: it is
    # ignored without a word, which is how the namespace below sat here unapplied since it was written.
    data:
      redis:
        namespace: wholestory:session
        # Indexed, so that every session of one person can be found and ended when their password is reset
        # (ADR 0021). The default repository cannot answer that question at all.
        repository-type: indexed
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # Port 465 is implicit TLS. Pairing it with starttls.enable is the usual mistake and hangs the connection.
      mail.smtp.ssl.enable: true
      # Stated rather than inherited: the certificate has to belong to the host being dialled, or TLS is only
      # encryption and not the assurance that the credentials are going to the right mail server.
      mail.smtp.ssl.checkserveridentity: true
      # Jakarta Mail waits forever by default, which would pin a thread on an unreachable mail host (ADR 0021).
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080

wholestory:
  mail:
    # A mailbox that exists at the mail host, so SPF and DKIM hold for what it sends.
    from: ${MAIL_FROM:no-reply@wholestory.world}
    # Where a reset link points: the dashboard host, which is the only place the form lives.
    base-url: ${WEB_BASE_URL:http://localhost:3000}
  session:
    # The rest of the cookie's attributes are set in SecurityConfig, where they cannot be lost.
    # Browsers treat localhost as a secure context, so this also holds for local development over HTTP.
    secure-cookie: ${SESSION_SECURE_COOKIE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
