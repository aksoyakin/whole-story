spring:
  application:
    name: ingest
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        linger.ms: 5
        enable.idempotence: true
    # Consumes the compacted site-events topic to know which domains are tracked.
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        # Off because there are none: Redis is used through RedisTemplate only, and the scan said so itself —
        # "Found 0 Redis repository interfaces" after a bootstrap that cost seven log lines to reach that
        # conclusion. Left on, it also drags Spring Data into strict mode wherever a second module is present
        # and makes it announce, once per JPA repository, that it cannot tell whose they are.
        enabled: false

server:
  port: 8081
  # Behind Traefik (Dokploy): the client IP comes from X-Forwarded-For.
  forward-headers-strategy: framework

ingest:
  topic-partitions: 6
  # Maintained by the geoipupdate sidecar in production; locally: infra/scripts/download-geoip.sh
  geoip-database: ${GEOIP_DATABASE:/geoip/GeoLite2-City.mmdb}
  # One visitor reporting more than this in a minute is not a person; see ADR 0016.
  max-events-per-visitor-per-minute: 60
  # The largest body one event may have. A tracker payload is a few hundred bytes; the room above that is for a
  # long url, a long referrer and custom event props, and it still refuses a body that could only be an attempt
  # to make us hold one. The limit above bounds how many events a visitor sends, this one bounds what each of
  # them costs in memory and in a row of analytics.events — and this endpoint is unauthenticated and the only
  # one reachable from the internet, so the bound is the point. ADR 0016.
  max-event-bytes: 8192

management:
  server:
    # A port of its own, reachable only on the internal network. /actuator/prometheus tells a reader how much
    # traffic every tracked site gets and why events are rejected; on a separate port no change to a public
    # route can expose it by accident (ingest is routed to from the public side).
    # Mirrors the service port so three services can run side by side on one machine: a single shared 9090
    # would have them fight over it, and a port collision is silent (current-state pitfall 5).
    port: 9081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      # Without this the HTTP timer publishes only count, sum and max — enough for an average, useless for the
      # question a load test asks ("how slow was the slow tenth?"). Buckets are what let Prometheus compute a
      # percentile over a window. Verified by scraping: histogram buckets only appear once this is set.
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    # Every Kafka client logs its entire resolved configuration when it is built — 92 lines for one admin
    # client, and these services build three apiece. It answers a question nobody asks twice, while the
    # settings it prints come from the file above.
    #
    # What this gives up, measured rather than assumed: the same logger's other message, "these
    # configurations were supplied but are not used yet", which names a pass-through property Kafka did not
    # recognise. It is INFO too, so no level separates the two — the first guess was that it was a warning
    # and an experiment with a deliberately misspelled property said otherwise.
    #
    # Given up knowingly. That notice only covers raw `properties.*` entries, of which these services set a
    # handful, and the integration tests build real clients against a real broker. The louder version of this
    # risk is a Boot property that is silently ignored (D-119), and this logger never covered that anyway.
    org.apache.kafka.common.config.AbstractConfig: warn
